# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Run locally:  cargo deny check
# CI:           see .github/workflows/deny.yml
#
# Division of responsibility between the two security tools:
#   * cargo-deny  (this file, .github/workflows/deny.yml) — license policy,
#     banned/duplicate crates, allowed registries, and advisory checks driven
#     by the RustSec database via the [advisories] section below.
#   * cargo-audit (.github/workflows/audit.yml) — dedicated RustSec advisory
#     scan that fails CI on any high/critical CVE. It is run separately so a
#     known CVE always blocks a push even if cargo-deny config changes.

[graph]
# Check all targets, including wasm32-unknown-unknown
targets = [
    { triple = "wasm32-unknown-unknown" },
    { triple = "x86_64-unknown-linux-gnu" },
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
version = 2
# All crates must satisfy at least one of the licenses listed here.
# Any crate whose license expression cannot be satisfied by this list will
# cause `cargo deny check licenses` to fail.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

# Warn (rather than error) when a license is in the allow list but unused.
unused-allowed-license = "warn"

# Minimum confidence threshold for license text detection (0.0–1.0).
# 0.8 is the cargo-deny default; keep it explicit.
confidence-threshold = 0.8

# Dev-dependencies are not shipped in the final WASM artifact, but we still
# check them to avoid accidentally pulling in a GPL crate during testing.
include-dev = true

# ---------------------------------------------------------------------------
# Advisories  (vulnerability database)
# ---------------------------------------------------------------------------
# NOTE: cargo-deny's advisory check here is complementary to cargo-audit in
# .github/workflows/audit.yml. cargo-audit is the authoritative CVE gate that
# fails CI on high/critical advisories; keep both in sync when ignoring.
[advisories]
# Fetch the RustSec advisory database on every run.
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "~/.cargo/advisory-db"
# Config version 2: any crate with a known vulnerability (RustSec advisory)
# is always denied unless explicitly listed in `ignore`.
version = 2
unmaintained = "workspace"
yanked = "deny"
ignore = []

# ---------------------------------------------------------------------------
# Bans  (duplicate / forbidden crates)
# ---------------------------------------------------------------------------
[bans]
# Deny multiple versions of the same crate to keep the dependency tree clean.
multiple-versions = "warn"
# Deny wildcard dependencies.
wildcards = "deny"

# ---------------------------------------------------------------------------
# Sources  (allowed registries / git hosts)
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
