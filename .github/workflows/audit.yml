name: Security Audit

# Division of responsibility between the two security tools:
#   - cargo-deny (see deny.toml): license compliance, banned/duplicate crates,
#     and source allow-listing. It does NOT query the RustSec advisory database.
#   - cargo-audit (this workflow): queries the RustSec advisory database for
#     known CVEs in the dependency tree and fails the build on high/critical
#     advisories.
# Both run in CI so that policy violations and known vulnerabilities are caught.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo audit binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.21

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # The RustSec advisory database is intentionally NOT cached: cargo-audit
      # fetches the latest advisories on every run so newly published CVEs are
      # detected immediately rather than after a cache expiry.
      - name: Update RustSec advisory database
        run: cargo audit --version && cargo audit --db ~/.cargo/advisory-db fetch || true

      # Fail the workflow on any high/critical CVE. `--deny warnings` treats
      # unmaintained/yanked/unsound advisories as errors, and `--deny unmaintained`
      # is covered by the same flag; vulnerabilities are always denied by default.
      - name: Run cargo audit
        run: cargo audit --deny warnings
