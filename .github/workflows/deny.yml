name: cargo-deny

# cargo-deny handles license compliance and banned/duplicate crate policy
# (see deny.toml). It does NOT query the RustSec advisory database for known
# CVEs — that is the job of the cargo-audit workflow (audit.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --workspace
