name: Integration

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 27.0.0

jobs:
  integration:
    name: Soroban sandbox integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-integration-

      - name: Install Stellar CLI
        run: command -v stellar || cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Run integration tests
        run: make integration-test

      - name: Verify deployed contract checksum
        if: ${{ env.CONTRACT_ID != '' && env.WASM_PATH != '' }}
        env:
          CONTRACT_ID: ${{ vars.CONTRACT_ID }}
          WASM_PATH: ${{ vars.WASM_PATH }}
          STELLAR_NETWORK: ${{ vars.STELLAR_NETWORK || 'testnet' }}
        run: |
          set -euo pipefail

          if [ ! -f "$WASM_PATH" ]; then
            echo "::error::Local WASM artifact not found at $WASM_PATH"
            exit 1
          fi

          local_hash=$(sha256sum "$WASM_PATH" | awk '{print $1}')

          info_output=$(stellar contract info --id "$CONTRACT_ID" --network "$STELLAR_NETWORK")
          deployed_hash=$(printf '%s\n' "$info_output" | grep -iE 'wasm[ _-]?hash' | head -n1 | grep -oE '[0-9a-fA-F]{64}' | head -n1 | tr 'A-F' 'a-f')

          if [ -z "$deployed_hash" ]; then
            echo "::error::Could not extract WASM hash from 'stellar contract info' output"
            printf '%s\n' "$info_output"
            exit 1
          fi

          {
            echo "## Contract checksum verification"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Contract ID | \`$CONTRACT_ID\` |"
            echo "| Network | \`$STELLAR_NETWORK\` |"
            echo "| Local WASM | \`$WASM_PATH\` |"
            echo "| Local SHA256 | \`$local_hash\` |"
            echo "| Deployed WASM hash | \`$deployed_hash\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$local_hash" != "$deployed_hash" ]; then
            echo "| Result | ❌ MISMATCH |" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployed WASM hash ($deployed_hash) does not match local SHA256 ($local_hash)"
            exit 1
          fi

          echo "| Result | ✅ MATCH |" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed WASM hash matches local artifact: $local_hash"
